<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo com Busca Global</title>

    <!-- Importando o Leaflet CSS e JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            color: #38bdf8;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }

        .map-wrapper {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 100%;
        }

        /* Barra de Pesquisa */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-container input {
            flex: 1;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
        }

        .search-container input:focus {
            border-color: #38bdf8;
        }

        .search-container button {
            padding: 0 20px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-container button:hover {
            background-color: #0ea5e9;
        }

        #map {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            z-index: 1;
        }

        #info-box {
            margin-top: 15px;
            padding: 15px 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-left: 5px solid #38bdf8;
            border-radius: 6px;
            font-size: 1rem;
        }

        #info-box strong {
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <h1>Mapa Geográfico com Busca Global</h1>
    <p class="subtitle">Pesquise ruas, avenidas, bairros, cidades, países, rios ou lagos e altere as camadas no canto
        superior direito.</p>

    <div class="map-wrapper">
        <!-- Caixa de Busca -->
        <div class="search-container">
            <input type="text" id="searchInput"
                placeholder="Digite ruas, cidades, rios, lagos ou países (ex: Rio Amazonas, Av Paulista, Tóquio)..." />
            <button onclick="realizarBusca()">Buscar</button>
        </div>

        <div id="map"></div>

        <div id="info-box">
            <strong>Status:</strong> Digite um local acima ou clique no mapa para começar.
        </div>
    </div>

    <script>
        // 1. Camadas de Base (Ruas, Satélite e Híbrido)
        const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        const rotulosHibridos = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        });

        const hibrido = L.layerGroup([satelite, rotulosHibridos]);

        // Inicializa o mapa com a camada de ruas padrão
        const map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            layers: [ruas]
        });

        // Adiciona o controle de camadas no canto superior direito
        L.control.layers({
            "🗺️ Ruas (Padrão)": ruas,
            "🌎 Satélite": satelite,
            "🛰️ Híbrido": hibrido
        }).addTo(map);

        let marcadorAtual = null;

        // 2. Função de Busca Global utilizando a API do OpenStreetMap (Nominatim)
        async function realizarBusca() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('info-box').innerHTML = `<strong>Status:</strong> Buscando por "${query}"...`;

            try {
                const resposta = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const dados = await resposta.json();

                if (dados && dados.length > 0) {
                    const local = dados[0];
                    const lat = parseFloat(local.lat);
                    const lon = parseFloat(local.lon);
                    const nomeCompleto = local.display_name;

                    // Move o mapa até o local encontrado com zoom aproximado (13)
                    map.setView([lat, lon], 13);

                    // Remove o marcador anterior se existir
                    if (marcadorAtual) {
                        map.removeLayer(marcadorAtual);
                    }

                    // Adiciona o novo marcador
                    marcadorAtual = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${nomeCompleto}</b>`)
                        .openPopup();

                    document.getElementById('info-box').innerHTML = `
                        <strong>Local Encontrado:</strong> ${nomeCompleto}<br>
                        <span style="color: #94a3b8; font-size: 0.9rem;">Coordenadas: Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}</span>
                    `;
                } else {
                    document.getElementById('info-box').innerHTML = `<strong>Aviso:</strong> Nenhum resultado encontrado para "${query}". Tente refinar a busca.`;
                }
            } catch (erro) {
                document.getElementById('info-box').innerHTML = `<strong>Erro:</strong> Falha ao conectar com o serviço de busca.`;
            }
        }

        // Permite buscar apertando a tecla "Enter" no teclado
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                realizarBusca();
            }
        });
    </script>

</body>

</html>
